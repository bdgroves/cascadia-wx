name: CASCADIA-WX - Daily Batch

on:
  schedule:
    # after each Quillayute balloon (00Z and 12Z) is in the archive, and the
    # morning run after the overnight SNOTEL reports:
    - cron: '17 15 * * *'    # 15:17 UTC = 8:17 AM PDT / 7:17 AM PST
    - cron: '17 3 * * *'     # 03:17 UTC = 8:17 PM PDT / 7:17 PM PST
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'CASCADIA-WX.f90', 'fetch_wx.py', 'stations.csv', 'run_job.sh', '.github/workflows/cascadia-wx.yml' ]

permissions:
  contents: write

concurrency:
  group: cascadia-wx-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-24.04          # pinned: GFortran 13 from Ubuntu noble
    steps:
      - uses: actions/checkout@v4

      - name: Install GFortran
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gfortran bc > /dev/null && gfortran --version | head -1

      - name: Run the batch job
        run: ./run_job.sh

      - name: Job log
        if: always()
        run: |
          cat job-log.txt || true
          # the key lines as annotations, so they show on the run's summary page
          grep -E '^STEP|CWX0[0-9]{2}[EW]|FAILED|ENDED' job-log.txt | head -10 | sed 's/^ */::notice::/' || true

      - name: Report
        run: cat cascadia-wx-report.txt

      - name: Warn when data were missing
        run: |
          rc=$(grep '^return_code,' summary.csv | cut -d, -f2)
          if [ "$rc" != "0" ]; then
            grep -h '^  CWX' cascadia-wx-report.txt | while read -r m; do echo "::warning::$m"; done
          fi

      - name: Commit the outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snotel_daily.csv sounding_series.csv upper_air.csv analysis.csv massif.csv \
                  review.csv summary.csv cascadia-wx-report.txt job-log.txt
          if git diff --staged --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "data: CASCADIA-WX batch $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
          git pull -q --rebase && git push -q
